# BIOGLUE Intelligence — runtime configuration.
# The only secret is DEEPSEEK_API_KEY (GitHub Actions secret or local env). It is never committed.
site:
  name: BIOGLUE Intelligence
  url: https://rethinksci-gif.github.io
  base: /bioglue-intelligence
  repo: rethinksci-gif/bioglue-intelligence

llm:
  base_url: https://api.deepseek.com
  # Flash only. Model name comes from env DEEPSEEK_MODEL (fallback below).
  model: deepseek-flash
  max_calls_per_run: 120     # overridden by env MAX_LLM_CALLS_PER_RUN
  batch_size: 8              # candidates per triage call
  max_retries: 2
  reasoning_headroom: 6000   # DeepSeek reasoning tokens count against max_tokens
  timeout_seconds: 180
  temperature: 0

scan:
  crossref_rows: 25          # per route query per quarter
  news_items: 30             # per news query (Google News RSS, date-bounded)
  min_relevance: 0.6         # below this a candidate is kept in the log but not shown
  mailto: bioglue-intelligence@users.noreply.github.com
